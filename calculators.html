<main class="container">


<div class="card">

<h2>TEU Calculator</h2>

<p>
Calculate container capacity using TEU measurement.
</p>


<label>
20ft Containers
</label>

<br>

<input type="number" id="twenty" placeholder="Enter 20ft quantity">


<br><br>


<label>
40ft Containers
</label>

<br>

<input type="number" id="forty" placeholder="Enter 40ft quantity">


<br><br>


<button onclick="calculateTEU()">
Calculate TEU
</button>


<h3 id="teuResult"></h3>


</div>



</main>



<footer>

<p>
© OpsToolkit | ASA Digital Solutions & Operations
</p>

</footer>



<script>

function calculateTEU(){

let twenty = Number(document.getElementById("twenty").value);

let forty = Number(document.getElementById("forty").value);

let total = (twenty * 1) + (forty * 2);

document.getElementById("teuResult").innerHTML =
"Total TEU: " + total;

}

</script>
